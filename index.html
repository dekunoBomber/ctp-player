<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>CTP player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #player { width: 100%; height: 100%; }
  /* 背景（bg）：真っ暗から1秒おいてふわっと出す。終わる前にふっと消す（最後のロゴの絵が一瞬出て驚く。司令部 11-17） */
  body.bg #player { opacity: 0; transition: opacity 1.5s ease; }
  body.bg.show #player { opacity: 1; }
</style>
</head>
<body>
<div id="player"></div>
<script>
// CITIZEN TAX PLANNER（Chrome 拡張機能）の BGM 用の中継の頁。
// 拡張機能の頁は Web のサイトではないので、YouTube の埋め込みが「どこのサイトか」を名乗れず再生できない（エラー 153）。
// この頁が自分の名前で YouTube の公式の埋め込みを出し、拡張機能からは「再生・止める・音量・曲の並び」だけを受け取る。
// データは何も集めない・どこにも送らない。
(function () {
  var player = null, pending = [];
  // 受けるのは、Chrome の拡張機能の頁の中に置かれた時だけ。返す先もその頁だけ。
  var host = (location.ancestorOrigins && location.ancestorOrigins[0]) || "";
  var fromExt = /^chrome-extension:\/\/[a-p]{32}$/.test(host);
  function tell(msg) { if (!fromExt) return; try { parent.postMessage(Object.assign({ ctp: 1 }, msg), host); } catch (e) {} }
  function run(m) {
    if (!player) { pending.push(m); return; }
    if (m.cmd === "play") player.playVideo();
    else if (m.cmd === "pause") player.pauseVideo();
    else if (m.cmd === "next") player.nextVideo();
    else if (m.cmd === "volume" && typeof m.vol === "number" && isFinite(m.vol)) player.setVolume(Math.max(0, Math.min(100, m.vol)));
    else if (m.cmd === "list" && Array.isArray(m.ids)) { var ok = m.ids.filter(function (x) { return typeof x === "string" && /^[\w-]{11}$/.test(x); }); if (ok.length) player.loadPlaylist(ok, 0); }
  }
  window.addEventListener("message", function (e) {
    if (e.source !== parent || !fromExt || e.origin !== host) return;
    var m = e.data;
    if (!m || m.ctp !== 1 || typeof m.cmd !== "string") return;
    run(m);
  });
  var q = new URLSearchParams(location.search);
  // 単独で開いた時（CTP の「♪ メインテーマ」の別の窓）は、題を窓の名前にして、用意ができたら自分で流す
  var alone = parent === window;
  // bg=1：CTP の空の画面の背景（司令部 11-17）。音を消し、操作の帯を出さず、用意ができたら自分で流して繰り返す
  var bg = q.get("bg") === "1";
  // start：流し始める秒。背景では、終わったらこの秒へ戻って繰り返す（頭の字幕を出さない。司令部 11-17）
  var start = Math.max(0, Math.min(36000, parseInt(q.get("start"), 10) || 0));
  var showT = null;
  if (bg) document.body.classList.add("bg");
  function show(on) { document.body.classList.toggle("show", on); }
  if (alone && q.get("title")) document.title = q.get("title");
  var ids = (q.get("ids") || "").split(",").filter(function (x) { return /^[\w-]{11}$/.test(x); });
  window.onYouTubeIframeAPIReady = function () {
    var p = new YT.Player("player", {
      width: "100%", height: "100%",
      videoId: ids[0] || undefined,
      // loop=0 の時は1回だけ流す（船の PV）。それ以外は並びを繰り返す。
      // 背景（bg）は playlist を付けない（付けると start が効かなかった）。繰り返しは、終わった時に自分で start へ戻す
      playerVars: bg ? { playsinline: 1, rel: 0, mute: 1, controls: 0, disablekb: 1, iv_load_policy: 3, loop: 0, start: start }
        : { playsinline: 1, loop: new URLSearchParams(location.search).get("loop") === "0" ? 0 : 1, playlist: ids.join(","), rel: 0 },
      events: {
        onReady: function () { player = p; tell({ ev: "ready" }); pending.splice(0).forEach(run); if (alone || bg) { if (bg) { p.mute(); if (start) p.seekTo(start, true); } p.playVideo(); }
          // 背景：終わる 4 秒前から消し始める（最後の絵を見せない）
          if (bg) setInterval(function () { try { var d = p.getDuration(), t = p.getCurrentTime(); if (d > 0 && d - t < 4) show(false); } catch (x) {} }, 250);
        },
        onStateChange: function (e) {
          if (bg) {
            clearTimeout(showT);
            // 流れ始めて、始める秒より後にいる時だけ、1秒おいて出す。始まる前・終わった時は消す（読み込み中の一時の待ちでは消さない）
            if (e.data === 1) showT = setTimeout(function () { try { if (p.getCurrentTime() >= start - 0.5) show(true); } catch (x) {} }, 1000);
            else if (e.data === 0 || e.data === -1 || e.data === 5) show(false);
            if (e.data === 0) { p.seekTo(start, true); p.playVideo(); }
          }
          var d = {}; try { d = p.getVideoData() || {}; } catch (x) {} tell({ ev: "state", info: e.data, title: d.title || "", id: d.video_id || "" }); },
        // 埋め込みが許されていない動画などは、知らせてから次へ進む
        onError: function (e) { tell({ ev: "error", info: e.data }); setTimeout(function () { try { p.nextVideo(); } catch (x) {} }, 800); }
      }
    });
  };
  var s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
})();
</script>
</body>
</html>
