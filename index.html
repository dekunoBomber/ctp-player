<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>CTP player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #player { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
// CITIZEN TAX PLANNER（Chrome 拡張機能）の BGM 用の中継の頁。
// 拡張機能の頁は Web のサイトではないので、YouTube の埋め込みが「どこのサイトか」を名乗れず再生できない（エラー 153）。
// この頁が自分の名前で YouTube の公式の埋め込みを出し、拡張機能からは「再生・止める・音量・曲の並び」だけを受け取る。
// データは何も集めない・どこにも送らない。
(function () {
  var player = null, pending = [];
  function tell(msg) { try { parent.postMessage(Object.assign({ ctp: 1 }, msg), "*"); } catch (e) {} }
  function run(m) {
    if (!player) { pending.push(m); return; }
    if (m.cmd === "play") player.playVideo();
    else if (m.cmd === "pause") player.pauseVideo();
    else if (m.cmd === "next") player.nextVideo();
    else if (m.cmd === "volume" && typeof m.vol === "number") player.setVolume(Math.max(0, Math.min(100, m.vol)));
    else if (m.cmd === "list" && Array.isArray(m.ids) && m.ids.length) player.loadPlaylist(m.ids.filter(function (x) { return /^[\w-]{11}$/.test(x); }), 0);
  }
  window.addEventListener("message", function (e) {
    if (e.source !== parent) return;
    var m = e.data;
    if (!m || m.ctp !== 1 || typeof m.cmd !== "string") return;
    run(m);
  });
  var ids = (new URLSearchParams(location.search).get("ids") || "").split(",").filter(function (x) { return /^[\w-]{11}$/.test(x); });
  window.onYouTubeIframeAPIReady = function () {
    var p = new YT.Player("player", {
      width: "100%", height: "100%",
      videoId: ids[0] || undefined,
      playerVars: { playsinline: 1, loop: 1, playlist: ids.join(","), rel: 0 },
      events: {
        onReady: function () { player = p; tell({ ev: "ready" }); pending.splice(0).forEach(run); },
        onStateChange: function (e) { var d = {}; try { d = p.getVideoData() || {}; } catch (x) {} tell({ ev: "state", info: e.data, title: d.title || "", id: d.video_id || "" }); },
        // 埋め込みが許されていない動画などは、知らせてから次へ進む
        onError: function (e) { tell({ ev: "error", info: e.data }); setTimeout(function () { try { p.nextVideo(); } catch (x) {} }, 800); }
      }
    });
  };
  var s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
})();
</script>
</body>
</html>
